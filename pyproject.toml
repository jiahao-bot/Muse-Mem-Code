[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-mem"
version = "1.0.0"
description = "Official research implementation of MUSE-Mem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anonymous Authors"}]
dependencies = []

[project.scripts]
muse-mem = "muse_mem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
muse_mem = ["prompts/*.txt", "storage/schema.sql"]

[tool.setuptools.packages.find]
where = ["src"]
